name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format . --check

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest
      - run: pytest tests/

  strategy-smoke:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m py_compile freqtrade/user_data/strategies/KivancSupertrendedMovingAverages1D.py
      - run: python -m json.tool freqtrade/user_data/config.json > /dev/null
      - run: python -m json.tool freqtrade/user_data/config_production.json > /dev/null
      - run: python -m json.tool freqtrade/user_data/strategies/KivancSupertrendedMovingAverages1D.json > /dev/null
