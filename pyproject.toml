[project]
name = "kivanc-supertrended-moving-averages"
version = "2.0.0"
description = "Lean Freqtrade repository for a single long-horizon crypto spot strategy based on Kivanc Ozbilgic's SuperTrended Moving Averages."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Emre Uludasdemir" }
]
keywords = ["freqtrade", "crypto", "supertrend", "moving-average", "backtest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "venv",
    "freqtrade/user_data/data",
    "freqtrade/user_data/backtest_results",
    "freqtrade/user_data/hyperopt_results",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q", "--tb=short"]
